connector.name=hive
hive.metastore.uri=thrift://amad-metastore:9083
fs.native-s3.enabled=true
s3.endpoint=http://amad-minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:AMAD_MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:AMAD_MINIO_ROOT_PASSWORD}
hive.non-managed-table-writes-enabled=true
